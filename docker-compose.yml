services:
  chat-viewer:
    build: .
    container_name: whatsapp-chat-viewer
    # Bound to this machine only by default, so your chats are not reachable from the network.
    # To open it to other devices on your network, put BIND_ADDRESS=0.0.0.0 in a .env file
    # next to this one (and turn on the screen lock in Settings).
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - chat-data:/data
    restart: unless-stopped

volumes:
  # Imported chats, settings and the custom background persist here.
  chat-data:
